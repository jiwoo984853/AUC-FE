name: Build & Deploy to https://github.com/jiwoo984853/Dopamine-FE

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
   build:
    runs-on: ubuntu-latest
    container: pandoc/latex

    steps:
      - uses: actions/checkout@v2
      - name: Install mustache (to update the date)
        run: apk add ruby && gem install mustache
      - name: creates output
        run: sh ./build.sh
      - name: Pushes to another repository
        id: push_directory
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTO_ACTIONS }}
        with:
          source-directory: 'output'
          destination-github-username: jiwoo984853
          destination-repository-name: Dopamine-FE
          user-email: ${{ secrets.EMAIL }}
          commit-message: "Deploy: ${{ github.event.head_commit.message }} (${{ github.sha }})"
          target-branch: dev
      - name: Test get variable exported by push-to-another-repository
        run: echo $DESTINATION_CLONED_DIRECTORY
